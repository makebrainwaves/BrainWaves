<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0);
        font-family:
          Helvetica Neue,
          serif;
      }

      #graph {
        display: block;
        width: 100%;
        height: 100%;
      }

      .axis line,
      .axis path,
      .axis {
        stroke: none;
        fill: none;
      }

      .axis text {
        font-size: 14px;
        fill: #484848;
        stroke: none;
      }

      .x-axis text {
        font-size: 12px;
      }

      .legend {
        font-size: 14px;
      }

      .line {
        fill: none;
      }
    </style>
  </head>
  <body>
    <svg id="graph" />
    <script type="module" src="./viewer.ts"></script>
  </body>
</html>
