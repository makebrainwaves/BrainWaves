name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # npm ci, not npm install: installs exactly the locked tree, so the commit
      # CI passes on is the commit that gets packaged.
      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Must follow Build — asserts out/ and the Pyodide payload are actually
      # on disk where the packaged app's protocol handler will look for them.
      - name: Verify build artifacts
        run: npm run test:build
