name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Gate. A tag must not publish anything until the same checks CI runs on every
  # push have passed on the tagged commit. Runs once rather than per-OS — test.yml
  # already covers the cross-OS matrix — but nothing is built or uploaded until
  # this job is green.
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  release:
    needs: verify
    runs-on: ${{ matrix.os }}

    strategy:
      # Stop the other platforms as soon as one fails, so a broken tag uploads
      # as few half-good artifacts as possible.
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Between build and publish: refuse to ship a build whose Pyodide payload
      # is missing. That failure is invisible in dev and breaks analysis entirely
      # in the packaged app.
      - name: Verify build artifacts
        run: npm run test:build

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: npx electron-builder build --publish always
